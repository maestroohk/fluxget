name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.3.1)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: dotnet test tests/FluxGet.Engine.Tests -c Release

      - name: Build application
        shell: pwsh
        run: |
          cd web; npm ci --no-audit --no-fund; npm run build; cd ..
          ./scripts/fetch-tools.ps1
          dotnet publish src/FluxGet.Desktop -c Release -r win-x64 --self-contained true -p:Version=${{ steps.v.outputs.version }} -o artifacts/publish/win-x64
          New-Item -ItemType Directory -Force artifacts/publish/win-x64/tools | Out-Null
          Copy-Item tools/bin/* artifacts/publish/win-x64/tools -Recurse -Force
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/publish/win-x64 -Force
          Copy-Item extension artifacts/publish/win-x64/extension -Recurse -Force
          Get-ChildItem artifacts/publish/win-x64/runtimes -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'win-x64' } | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force artifacts/to-sign | Out-Null
          Get-ChildItem artifacts/publish/win-x64 -File | Where-Object { $_.Name -like 'FluxGet*.exe' -or $_.Name -like 'FluxGet*.dll' } | Copy-Item -Destination artifacts/to-sign

      - name: Upload unsigned FluxGet binaries
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fluxget-binaries-unsigned
          path: artifacts/to-sign

      - name: Sign FluxGet binaries (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fluxget
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Use signed binaries
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed/* artifacts/publish/win-x64 -Force

      - name: Package installer
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId FluxGet --packVersion ${{ steps.v.outputs.version }} --packDir artifacts/publish/win-x64 --mainExe FluxGet.exe --packTitle FluxGet --icon src/FluxGet.Desktop/fluxget.ico --splashImage src/FluxGet.Desktop/installer-splash.png --packAuthors FluxGet --outputDir artifacts/releases
          Compress-Archive -Path extension/* -DestinationPath artifacts/releases/FluxGet-extension-${{ steps.v.outputs.version }}.zip

      - name: Upload unsigned installer
        id: setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fluxget-setup-unsigned
          path: artifacts/releases/FluxGet-win-Setup.exe

      - name: Sign installer (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fluxget
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-setup

      - name: Use signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed-setup/FluxGet-win-Setup.exe artifacts/releases/FluxGet-win-Setup.exe -Force

      - uses: actions/upload-artifact@v4
        with:
          name: fluxget-${{ steps.v.outputs.version }}
          path: artifacts/releases

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if ($env:SIGNPATH_ENABLED -eq 'true') { 'Signed release.' } else { 'Unsigned build: Windows SmartScreen will warn until code signing is set up. See docs/CODE_SIGNING_POLICY.md.' }
          gh release create ${{ github.ref_name }} artifacts/releases/* --title "FluxGet ${{ steps.v.outputs.version }}" --notes $notes
