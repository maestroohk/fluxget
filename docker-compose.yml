services:
  fluxget:
    build: .
    image: fluxget:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FluxGet__AccessToken: ${FLUXGET_ACCESS_TOKEN:?Set FLUXGET_ACCESS_TOKEN to a random secret of at least 24 characters}
      FluxGet__AllowedHosts__0: localhost
      FluxGet__AllowedHosts__1: 127.0.0.1
    volumes:
      - fluxget-data:/data
      - ./downloads:/downloads
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  fluxget-data:
